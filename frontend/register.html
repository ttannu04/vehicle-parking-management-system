<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — SmartPark</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrapper">

    <div class="auth-card card">

        <div class="auth-logo">
            <div class="icon">🚗</div>

            <h2>Create Account</h2>

            <p>Register to manage parking easily</p>
        </div>

        <!-- ALERT -->
        <div id="alert" class="alert"></div>

        <!-- NAME -->
        <div class="form-group" id="grp-name">
            <label for="name">Full Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
            >

            <div class="error-msg">
                Name is required
            </div>
        </div>

        <!-- EMAIL -->
        <div class="form-group" id="grp-email">
            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="you@example.com"
            >

            <div class="error-msg">
                Enter valid email
            </div>
        </div>

        <!-- PASSWORD -->
        <div class="form-group" id="grp-pass">
            <label for="pass">Password</label>

            <input
                type="password"
                id="pass"
                placeholder="Minimum 8 characters"
            >

            <div class="error-msg">
                Password must contain:
                8 chars, 1 uppercase, 1 number
            </div>
        </div>

        <!-- BUTTON -->
        <button
            id="regBtn"
            class="btn btn-primary btn-block"
            onclick="register()"
        >
            Create Account
        </button>

        <!-- FOOTER -->
        <div class="auth-footer">
            Already have an account?
            <a href="login.html">Login here</a>
        </div>

    </div>

</div>

<!-- ====================================================== -->
<!-- Scripts -->
<!-- ====================================================== -->

<script src="js/utils.js"></script>

<script>

window.addEventListener("DOMContentLoaded", () => {

    // Redirect if already logged in
    if (getToken()) {
        window.location.href = "dashboard.html";
    }

    async function register() {

        try {

            const name  = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const pass  = document.getElementById("pass").value;

            const btn = document.getElementById("regBtn");

            // Remove old errors
            ["grp-name", "grp-email", "grp-pass"].forEach(id => {
                document.getElementById(id).classList.remove("has-error");
            });

            let valid = true;

            // Name validation
            if (!name) {
                document.getElementById("grp-name").classList.add("has-error");
                valid = false;
            }

            // Email validation
            if (!/^\S+@\S+\.\S+$/.test(email)) {
                document.getElementById("grp-email").classList.add("has-error");
                valid = false;
            }

            // Password validation
            if (!/^(?=.*[A-Z])(?=.*[0-9]).{8,}$/.test(pass)) {
                document.getElementById("grp-pass").classList.add("has-error");
                valid = false;
            }

            if (!valid) return;

            // Loading state
            setLoading(btn, true);

            // API request
            const res = await apiFetch("/user/register", {
                method: "POST",

                body: JSON.stringify({
                    name,
                    email,
                    password: pass
                })
            });

            // Remove loading
            setLoading(btn, false);

            if (!res) return;

            // Success
            if (res.ok) {

                showAlert(
                    "alert",
                    "Account created successfully!",
                    "success"
                );

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1500);

            } else {

                const msg =
                    res.data?.errors?.[0]?.msg ||
                    res.data?.error ||
                    "Registration failed.";

                showAlert(
                    "alert",
                    msg,
                    "error"
                );
            }

        } catch (err) {

            console.error("Register Error:", err);

            showAlert(
                "alert",
                "Something went wrong.",
                "error"
            );
        }
    }

    // IMPORTANT
    window.register = register;

});
</script>

</body>
</html>
