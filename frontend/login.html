<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — SmartPark</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="auth-wrapper">

    <div class="auth-card card">

        <div class="auth-logo">
            <div class="icon">🚗</div>
            <h2>Welcome back</h2>
            <p>Sign in to manage your parking</p>
        </div>

        <div id="alert" class="alert"></div>

        <!-- Email -->
        <div class="form-group" id="grp-email">
            <label for="email">Email address</label>

            <input
                type="email"
                id="email"
                placeholder="you@example.com"
                autocomplete="email"
            >

            <div class="error-msg" id="err-email">
                Enter a valid email.
            </div>
        </div>

        <!-- Password -->
        <div class="form-group" id="grp-pass">

            <label for="pass">Password</label>

            <input
                type="password"
                id="pass"
                placeholder="••••••••"
                autocomplete="current-password"
            >

            <div class="error-msg" id="err-pass">
                Password is required.
            </div>

        </div>

        <!-- Button -->
        <button
            id="loginBtn"
            class="btn btn-primary btn-block"
            onclick="login()"
        >
            Sign In
        </button>

        <div class="auth-footer">
            Don't have an account?
            <a href="register.html">Register here</a>
        </div>

    </div>

</div>

<script src="js/utils.js"></script>

<script>

    // Redirect if already logged in
    if (getToken()) {
        window.location.href = "dashboard.html";
    }

    async function login() {

        const email = document.getElementById("email").value.trim();
        const pass  = document.getElementById("pass").value;

        const btn = document.getElementById("loginBtn");

        // Reset validation
        document.getElementById("grp-email").classList.remove("has-error");
        document.getElementById("grp-pass").classList.remove("has-error");

        let valid = true;

        // Email validation
        if (!/^\S+@\S+\.\S+$/.test(email)) {
            document.getElementById("grp-email").classList.add("has-error");
            valid = false;
        }

        // Password validation
        if (!pass) {
            document.getElementById("grp-pass").classList.add("has-error");
            valid = false;
        }

        if (!valid) return;

        try {

            setLoading(btn, true);

            const res = await apiFetch("/user/login", {
                method: "POST",
                body: JSON.stringify({
                    email,
                    password: pass
                })
            });

            setLoading(btn, false);

            if (!res) return;

            // SUCCESS
            if (res.ok) {

                saveAuth(
                    res.data.token,
                    res.data.user
                );

                showAlert(
                    "alert",
                    "Login successful!",
                    "success"
                );

                // Redirect by role
                setTimeout(() => {

                    if (res.data.user.role === "admin") {
                        window.location.href = "admin.html";
                    } else {
                        window.location.href = "dashboard.html";
                    }

                }, 700);

            } else {

                showAlert(
                    "alert",
                    res.data.error || "Login failed.",
                    "error"
                );
            }

        } catch (err) {

            console.error(err);

            showAlert(
                "alert",
                "Server error. Please try again.",
                "error"
            );

            setLoading(btn, false);
        }
    }

    // Enter key support
    document.addEventListener("keydown", e => {
        if (e.key === "Enter") login();
    });

</script>

</body>
</html>
